<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-label="Ryan Liu's GitHub Stats: 178 stars, 213 commits, 5,259 downloads">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#00b7ff"/>
    </linearGradient>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="0.5" stop-color="#00b7ff"/>
      <stop offset="1" stop-color="#ff4fa3"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1600 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowPink">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#00b7ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00b7ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="798" height="208" rx="14"/></clipPath>
  </defs>
  <style>
    .title { font: 700 15px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: 0.5px; }
    .sub { font: 400 12px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #6e7681; }
    .num { font: 800 44px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: url(#accent); }
    .label { font: 600 11px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 2.5px; }
    .stat { opacity: 0; animation: rise 0.7s ease-out forwards; }
    .s1 { animation-delay: 0.1s; } .s2 { animation-delay: 0.3s; } .s3 { animation-delay: 0.5s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect x="1" y="1" width="798" height="208" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="90" cy="10" r="220" fill="url(#glowPink)"/>
    <circle cx="730" cy="210" r="240" fill="url(#glowBlue)"/>
  </g>
  <rect x="1" y="1" width="798" height="208" rx="14" fill="none" stroke="url(#border)" stroke-width="2"/>

  <text x="32" y="44" class="title">Ryan Liu</text>
  <text x="768" y="44" class="sub" text-anchor="end">updated Nov 23, 2026</text>

  <line x1="275" y1="78" x2="275" y2="178" stroke="#30363d"/>
  <line x1="525" y1="78" x2="525" y2="178" stroke="#30363d"/>

  <g class="stat s1">
    <svg x="140" y="70" width="20" height="20" viewBox="0 0 16 16" fill="#ff4fa3"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
    <text x="150" y="140" class="num" text-anchor="middle">178</text>
    <text x="150" y="172" class="label" text-anchor="middle">STARS</text>
  </g>

  <g class="stat s2">
    <svg x="390" y="70" width="20" height="20" viewBox="0 0 16 16" fill="#b56bff"><path d="M11.93 8.5a4.002 4.002 0 0 1-7.86 0H.75a.75.75 0 0 1 0-1.5h3.32a4.002 4.002 0 0 1 7.86 0h3.32a.75.75 0 0 1 0 1.5Zm-1.43-.75a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/></svg>
    <text x="400" y="140" class="num" text-anchor="middle">213</text>
    <text x="400" y="172" class="label" text-anchor="middle">COMMITS</text>
  </g>

  <g class="stat s3">
    <svg x="640" y="70" width="20" height="20" viewBox="0 0 16 16" fill="#00b7ff"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14ZM7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"/></svg>
    <text x="650" y="140" class="num" text-anchor="middle">5,259</text>
    <text x="650" y="172" class="label" text-anchor="middle">DOWNLOADS</text>
  </g>
</svg>
