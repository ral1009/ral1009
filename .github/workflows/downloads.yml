name: Update download count
on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sum release downloads across all repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: ${{ github.repository_owner }}
        run: |
          total=0
          for repo in $(gh api --paginate "users/$USER/repos?per_page=100" --jq '.[] | select(.fork|not) | .name'); do
            n=$(gh api --paginate "repos/$USER/$repo/releases?per_page=100" \
                 --jq '[.[].assets[].download_count] | add // 0' | awk '{s+=$1} END {print s+0}')
            total=$((total + n))
          done
          echo "{\"schemaVersion\":1,\"label\":\"total downloads\",\"message\":\"$total\",\"color\":\"blue\"}" > downloads.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add downloads.json
          git diff --cached --quiet || (git commit -m "Update download count" && git push)
