name: Update stats cards
on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    paths:
      - ".github/build-cards.sh"
      - ".github/workflows/downloads.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw stats and project cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: ${{ github.repository_owner }}
        run: bash .github/build-cards.sh
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q --ignore-unmatch stats.svg downloads.json cards/NSMBWiicompiled.svg cards/daydream.svg cards/campfire.svg cards/tunerapp.svg
          git add stats-*.svg cards
          git diff --cached --quiet || (git commit -m "Update stats cards" && git push)
